services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: layout_studio
      POSTGRES_USER: layout_studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U layout_studio -d layout_studio"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &worker-env
      LSS_ENVIRONMENT: production
      LSS_JWT_SECRET: ${LSS_JWT_SECRET:?Set LSS_JWT_SECRET in .env}
      LSS_ADMIN_USERNAME: ${LSS_ADMIN_USERNAME:-admin}
      LSS_ADMIN_PASSWORD: ${LSS_ADMIN_PASSWORD:?Set LSS_ADMIN_PASSWORD in .env}
      LSS_DATABASE_URL: postgresql+psycopg://layout_studio:${POSTGRES_PASSWORD}@postgres:5432/layout_studio
      LSS_DATA_DIR: /app/data
      LSS_TASK_BACKEND: celery
      LSS_CELERY_BROKER_URL: redis://redis:6379/0
      LSS_CELERY_RESULT_BACKEND: redis://redis:6379/1
      LSS_CORS_ORIGINS: ${LSS_CORS_ORIGINS:-http://localhost:8080}
      LSS_MAX_UPLOAD_BYTES: ${LSS_MAX_UPLOAD_BYTES:-10737418240}
      LSS_LAYOUT_CACHE_ENTRIES: ${LSS_LAYOUT_CACHE_ENTRIES:-4}
    volumes:
      - layout-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    mem_limit: 4g
    cpus: 2
    pids_limit: 256

  parser-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "worker", "--loglevel=INFO", "--queues=parser", "--concurrency=2", "--hostname=parser@%h"]
    environment: *worker-env
    volumes:
      - layout-data:/app/data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 8g
    cpus: 4
    pids_limit: 512

  screenshot-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "worker", "--loglevel=INFO", "--queues=screenshot", "--concurrency=2", "--hostname=screenshot@%h"]
    environment: *worker-env
    volumes:
      - layout-data:/app/data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 4g
    cpus: 4
    pids_limit: 512

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128

volumes:
  postgres-data:
  redis-data:
  layout-data:
